[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-inverse-heat"
version = "0.1.0"
description = "Inverse heat-transfer PINN: estimate thermal diffusivity from sparse sensor data"
readme = "README.md"
requires-python = ">=3.10"
# Exact tested versions are pinned in requirements.txt.
dependencies = ["numpy", "pandas", "matplotlib", "torch"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
