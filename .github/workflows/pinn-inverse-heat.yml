name: pinn-inverse-heat

on:
  push:
    paths:
      - "pinn-inverse-heat/**"
      - ".github/workflows/pinn-inverse-heat.yml"
  pull_request:
    paths:
      - "pinn-inverse-heat/**"
      - ".github/workflows/pinn-inverse-heat.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinn-inverse-heat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU build of torch, versions from requirements.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(grep -E '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Tests (physics on exact fields, tiny synthetic training case)
        run: python -m pytest -q

      - name: Smoke run (50 epochs on the committed dataset, CPU)
        run: python -m pinn train --epochs 50 --device cpu

      - name: Keep the smoke-run figures
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-50-epochs
          path: pinn-inverse-heat/outputs_cli/
          retention-days: 7
